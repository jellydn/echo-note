name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly (00:00 UTC) so dependency drift and toolchain upgrades are
    # caught even when no PR is open — dtolnay/rust-toolchain@stable pulls
    # the latest stable, and Renovate bumps land on main without a PR.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (clippy + test)
    # The app targets macOS (BlackHole, Keychain, osascript) — this runner matches
    # the dev environment and avoids Linux webkit2gtk/alsa system-dependency setup.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The export-fidelity differential test (tests/export_fidelity.rs) spawns
      # `bun scripts/export-diff.mts` to render the shared fixture through the
      # TS mock builders, so the Rust job needs bun on PATH.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  frontend:
    name: Frontend (typecheck + biome + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Biome
        run: bun run lint
      - name: Vitest
        run: bun run test:run

  # Fires only on the nightly cron (and manual dispatch, for testing). The
  # schedule trigger is read from the default branch only, so this job sees
  # exactly the case the cron exists for: the matrix going red on main with no
  # PR open. Opens or re-opens a labeled issue when a job fails, and closes it
  # once a later nightly run is green again (self-healing, no spam).
  nightly-alert:
    name: Nightly failure alert (main)
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or close the nightly-failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'nightly-failure';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // Cancelled (superseded by concurrency) runs are not alerts.
            const failed = Object.entries(needs)
              .filter(([, job]) => job.result === 'failure' || job.result === 'timed_out')
              .map(([name]) => name);

            // Ensure the label exists (idempotent; issues: write required).
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd73a4a',
                description: 'Nightly CI on main failed; dependency or toolchain drift',
              });
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 10,
            });
            const alertIssue = open[0];

            if (failed.length === 0) {
              if (alertIssue) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: alertIssue.number,
                  body: `✅ Nightly CI is green again (${runUrl}) — closing this alert.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: alertIssue.number, state: 'closed',
                });
              }
              console.log('Nightly matrix green; no alert needed.');
              return;
            }

            const body = [
              '❌ **Nightly CI failed on main** — no PR was open to catch this.',
              '',
              `Failed job(s): **${failed.join(', ')}**`,
              `Run: ${runUrl}`,
              `Event: ${context.eventName} · Time: ${new Date().toISOString()}`,
              '',
              'Likely dependency or toolchain drift: the stable Rust toolchain and Renovate',
              'bumps land on main without a PR, so this is the canary for breakage.',
            ].join('\n');

            if (alertIssue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: alertIssue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Nightly CI failed on main', body, labels: [label] });
            }
