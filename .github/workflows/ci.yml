name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (clippy + test)
    # The app targets macOS (BlackHole, Keychain, osascript) — this runner matches
    # the dev environment and avoids Linux webkit2gtk/alsa system-dependency setup.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The export-fidelity differential test (tests/export_fidelity.rs) spawns
      # `bun scripts/export-diff.mts` to render the shared fixture through the
      # TS mock builders, so the Rust job needs bun on PATH.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  frontend:
    name: Frontend (typecheck + biome + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Biome
        run: bun run lint
      - name: Vitest
        run: bun run test:run
